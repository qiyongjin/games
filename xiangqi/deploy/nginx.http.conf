# Certificate bootstrap configuration for xiangqi.qyjai.com.
# Install in the active Nginx http{} include directory, then test and reload
# the SAME Nginx instance. Replace with nginx.https.conf after issuing a certificate.
server {
    listen 80;
    server_name xiangqi.qyjai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xiangqi-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # The admin password is only submitted over HTTPS.
    location = /admin { return 403; }
    location = /admin.html { return 403; }
    location ^~ /api/admin/ { return 403; }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
