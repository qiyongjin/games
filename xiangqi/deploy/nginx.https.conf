# Install ONLY after these certificate files exist.
# This replaces nginx.http.conf; do not enable both configurations.
server {
    listen 80;
    server_name xiangqi.qyjai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xiangqi-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://xiangqi.qyjai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xiangqi.qyjai.com;
    ssl_certificate /etc/letsencrypt/live/xiangqi.qyjai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiangqi.qyjai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:xiangqi_tls:10m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
